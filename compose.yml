# Desarrollo: backend + frontend con hot-reload + postgres.
# Uso: docker compose --env-file .env.development up --build
name: who-lies

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en tu .env}
      POSTGRES_DB: ${POSTGRES_DB:-who_lies}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app

  backend:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${PORT:-3001}:3001'
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL en tu .env}
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/prisma:/app/prisma:ro
      - backend_node_modules:/app/node_modules
    networks:
      - app
    # Regenera el cliente Prisma por si el volumen lo oculta, luego watch mode.
    command: ['sh', '-c', 'npx prisma generate && npm run start:dev']

  frontend:
    build:
      context: ./frontend
      target: development
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:5173'
    environment:
      VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:3001}
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - frontend_node_modules:/app/node_modules
    networks:
      - app
    command: ['npm', 'run', 'dev', '--', '--host', '0.0.0.0', '--port', '5173']
